<body>
  <header class="site-header">
    <a class="logo" href="https://mdothree.com">m<span class="dot">.</span>3</a>
    <nav class="tool-nav">
      <a href="/">Generator</a>
      <a href="/strength" class="active">Strength</a>
      <a href="/passphrase">Passphrase</a>
      <a href="/pin">PIN</a>
      <a href="/breach">Breach Check</a>
      <a href="https://mdothree.com/pro" class="pro-nav-link">★ Pro</a>
    </nav>
  </header>

  <main class="tool-main">
    <div class="tool-header">
      <h1>Password Strength Meter</h1>
      <p>Analyze any password in real time. Nothing you type is recorded or transmitted.</p>
    </div>
    <div class="tool-body">
      <div>
        <label class="field-label" for="testPw">Your Password</label>
        <div class="input-with-action">
          <input type="password" id="testPw" class="input-field" placeholder="Type to analyze…" autocomplete="off" />
          <button class="btn-ghost btn-icon-sm" id="toggleVis" aria-label="Toggle visibility">👁</button>
        </div>
      </div>
      <div class="strength-bar-wrap">
        <div class="strength-bar-track">
          <div class="strength-bar-fill" id="sFill"></div>
        </div>
        <span class="strength-label" id="sLabel">—</span>
      </div>
      <div class="output-panel" id="analysis" hidden>
        <div class="analysis-grid">
          <div>
            <div class="field-label">Entropy</div>
            <div id="entropy" class="analysis-value">—</div>
          </div>
          <div>
            <div class="field-label">Level</div>
            <div id="level" class="analysis-value">—</div>
          </div>
        </div>
        <div class="field-label">Suggestions</div>
        <ul id="feedback" class="feedback-list"></ul>
      </div>
    </div>
  </main>

  <script src="js/pages/strength.js" type="module"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
