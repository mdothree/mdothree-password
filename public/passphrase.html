<body>
  <header class="site-header">
    <a class="logo" href="https://mdothree.com">m<span class="dot">.</span>three</a>
    <nav class="tool-nav">
      <a href="/">Generator</a>
      <a href="/strength">Strength</a>

      <a href="/breach">Breach Check</a>
      <a href="https://mdothree.com/pro" class="pro-nav-link">★ Pro</a>
    </nav>
  </header>

  <main class="tool-main">
    <div class="tool-header">
      <h1>Passphrase Generator</h1>
      <p>Generate memorable yet secure passphrases from random words. <strong>Pro feature.</strong></p>
    </div>
    <div class="tool-body">
      <div class="password-display-wrap">
        <div class="password-display" id="phraseDisplay">Click Generate</div>
        <div class="pw-actions">
          <button class="btn-icon" id="copyPhraseBtn" title="Copy">⎘</button>
          <button class="btn-icon" id="refreshPhraseBtn" title="Regenerate">↻</button>
        </div>
      </div>
      <div id="entropyInfo" class="entropy-info"></div>
      <div class="option-row">
        <label class="field-label">Word count: <span id="wordCountVal">4</span></label>
        <input type="range" id="wordCount" class="slider" min="2" max="8" value="4" />
      </div>
      <div class="option-row">
        <label class="field-label" for="separator">Separator</label>
        <input type="text" id="separator" class="input-field input-field--narrow" value="-" maxlength="3" />
      </div>
      <div class="option-section">
        <label class="field-label">Options</label>
        <div class="checkbox-grid">
          <label class="checkbox-item"><input type="checkbox" id="capitalize" /> Capitalize words</label>
          <label class="checkbox-item"><input type="checkbox" id="addNumber" /> Append number</label>
          <label class="checkbox-item"><input type="checkbox" id="addSymbol" /> Append symbol</label>
        </div>
      </div>
      <div class="action-row">
        <button class="btn-primary" id="genPhraseBtn">Generate</button>
        <button class="btn-ghost" id="copyPhraseBtn2">Copy</button>
      </div>
    </div>
  </main>

  <script src="js/pages/passphrase.js" type="module"></script>

  <script>
    if ('serviceWorker' in navigator) {
