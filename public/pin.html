<body>
  <header class="site-header">
    <a class="logo" href="https://mdothree.com">m<span class="dot">.</span>3</a>
    <nav class="tool-nav">
      <a href="/">Generator</a>
      <a href="/strength">Strength</a>
      <a href="/passphrase">Passphrase</a>
      <a href="/pin" class="active">PIN</a>
      <a href="/breach">Breach Check</a>
      <a href="https://mdothree.com/pro" class="pro-nav-link">★ Pro</a>
    </nav>
  </header>

  <main class="tool-main">
    <div class="tool-header">
      <h1>PIN Generator</h1>
      <p>Generate cryptographically secure numeric PINs of any length.</p>
    </div>
    <div class="tool-body">
      <div class="password-display-wrap">
        <div class="password-display pw-display--pin" id="pinDisplay">—</div>
        <div class="pw-actions">
          <button class="btn-icon" id="copyPin" title="Copy PIN">⎘</button>
          <button class="btn-icon" id="refreshPin" title="Regenerate">↻</button>
        </div>
      </div>
      <div class="option-row">
        <label class="field-label">Length: <span id="pinLenVal">6</span> digits</label>
        <input type="range" id="pinLen" class="slider" min="4" max="24" value="6" />
      </div>
      <div class="option-section">
        <label class="field-label">Options</label>
        <div class="checkbox-grid">
          <label class="checkbox-item">
            <input type="checkbox" id="avoidSeq" checked /> Avoid sequential (123…)
          </label>
          <label class="checkbox-item">
            <input type="checkbox" id="avoidRepeat" checked /> Avoid repeating (111…)
          </label>
        </div>
      </div>
      <div class="option-row">
        <label class="field-label">Count</label>
        <input type="number" id="pinCount" class="input-field input-field--narrow" value="5" min="1" max="50" / inputmode="numeric">
      </div>
      <div class="action-row">
        <button class="btn-primary" id="genPins">Generate</button>
        <button class="btn-ghost" id="copyAllPins">Copy All</button>
      </div>
      <div class="output-panel">
        <label class="field-label">PINs</label>
        <div id="pinList" class="pw-list"></div>
      </div>
    </div>
  </main>

  <script src="js/pages/pin.js" type="module"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
